name: build

# Three very different jobs, on purpose:
#
#   verify  - GitHub's own hosted runners, every push. It cannot build an Android
#             image (no LineageOS tree, no 250 GiB of disk), but it does the checks
#             that catch real mistakes: every shell script parses, the workflow is
#             valid YAML, the makefiles point at files that exist, and sketchd
#             compiles, links and runs the whole .deb path against a real userland.
#
#   runtime - also hosted, also real output: sketchd for both architectures, the
#             Debian userland, a bootable initramfs, and for amd64 a live ISO and
#             a disk image. Then it BOOTS the medium in QEMU and installs a .deb
#             inside it, so the download on the releases page is known to work.
#             Everything it makes is published as <tag>-arm64 and <tag>-amd64.
#
#   sync/build/image-release - the Android image itself, which needs a machine
#             with the LineageOS tree, ~250 GiB free and hours to spare, so it
#             only runs on a self-hosted runner, registered with:
#               ./config.sh --labels self-hosted,linux,aosp
#             and only when asked (Actions -> Run workflow) or on a tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options: [userdebug, user]
        default: userdebug
      publish:
        description: "Publish a GitHub release from the artifacts"
        type: boolean
        default: false
      tag:
        description: "Release tag (blank: sketch-<run number>)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: sketch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- hosted ---
  verify:
    name: verify (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse
        run: |
          set -e
          for f in build.sh scripts/*.sh; do
            bash -n "$f"
            echo "ok   $f"
          done

      - name: Scripts are executable
        run: |
          # A warning, not a failure: these files were authored on a device
          # without a shell, so the mode bits are not set in git. Everything in
          # this repository invokes the scripts as `bash script.sh`, so it all
          # works anyway; this only flags it so it can be tidied up.
          missing=0
          for f in build.sh scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "::notice file=$f::not executable in git - run: chmod +x build.sh scripts/*.sh"
              missing=$((missing + 1))
            fi
          done
          echo "$missing file(s) without the executable bit (harmless, see above)"

      - name: Workflow YAML is valid
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml
          # Note: PyYAML reads the bare `on:` key as boolean True (YAML 1.1),
          # which is why only "jobs" is checked here.
          for path in (".github/workflows/build.yml",):
              with open(path) as fh:
                  doc = yaml.safe_load(fh)
              if not (isinstance(doc, dict) and "jobs" in doc):
                  sys.exit("invalid workflow: " + path)
              print("ok  ", path, "->", ", ".join(doc["jobs"]))
          PY

      - name: Android build files reference real paths
        run: |
          set -e
          # Every file the makefiles and Android.bp point at must exist.
          for f in \
            vendor/sketch/sketch_arm64.mk \
            vendor/sketch/sketch_x86_64.mk \
            vendor/sketch/sketch_product.mk \
            vendor/sketch/debloat.mk \
            vendor/sketch/AndroidProducts.mk \
            vendor/sketch/sketch.h \
            vendor/sketch/sketchd/sketch.rc \
            vendor/sketch/sepolicy/sketchd.te \
            vendor/sketch/sepolicy/file_contexts ; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok   $f"
          done
          # The daemon sources listed in Android.bp must be the ones on disk.
          python3 - <<'PY'
          import re, os, sys
          bp = open("vendor/sketch/sketchd/Android.bp").read()
          listed = set(re.findall(r'"([a-z_]+\.cpp)"', bp))
          present = {f for f in os.listdir("vendor/sketch/sketchd") if f.endswith(".cpp")}
          if listed != present:
              print("Android.bp srcs differ from disk")
              print("  only in Android.bp:", sorted(listed - present))
              print("  only on disk      :", sorted(present - listed))
              sys.exit(1)
          print("ok   Android.bp srcs match disk:", ", ".join(sorted(listed)))
          PY

      - name: sketchd compiles and links
        run: |
          set -e
          # glibc is close enough to bionic for this code: pipe2, accept4,
          # clearenv and the socket headers all exist on both, so a hosted
          # runner really does prove the daemon builds.
          g++ -std=c++20 -O1 -Wall -Wextra \
              -Wno-unused-parameter -Wno-sign-compare \
              -Ivendor/sketch \
              -o /tmp/sketchd \
              vendor/sketch/sketchd/*.cpp
          echo "--- linked ok ---"
          ls -l /tmp/sketchd
          file /tmp/sketchd

      - name: sketchd runs
        run: |
          set -e
          # No root, no /data/sketch: these paths must fail cleanly, not crash.
          /tmp/sketchd about
          /tmp/sketchd help
          /tmp/sketchd arch
          echo "--- must refuse input it cannot install ---"
          if /tmp/sketchd install /etc/hostname; then
            echo "::error::install accepted something it should have refused"
            exit 1
          fi
          echo "ok   refused a non-.deb / unprivileged install"

      - name: The CLI name dispatches as the CLI
        run: |
          set -e
          cp /tmp/sketchd /tmp/deb
          /tmp/deb about | head -3
          /tmp/deb list

      # The whole point of this job: prove the .deb runtime works with no image.
      # run-local.sh is what a user runs on their own Linux box; here it runs on
      # a hosted runner, which is the cheapest possible proof that the feature
      # is real rather than described.
      - name: .deb runtime works with no image - build it and its userland
        run: |
          set -e
          # debootstrap makes the Debian userland; dpkg-dev supplies dpkg-deb
          # for the demo package. Neither is on the runner by default.
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap dpkg-dev
          bash ./scripts/run-local.sh build
          sudo bash ./scripts/run-local.sh userland
          ls -la .local-run/base/*.tar.gz

      - name: .deb runtime works with no image - install a real package
        run: |
          set -e
          sudo env SKETCH_LOCAL_DIR="$PWD/.local-run" \
            bash ./scripts/run-local.sh init
          sudo env SKETCH_LOCAL_DIR="$PWD/.local-run" \
            bash ./scripts/run-local.sh demo

      - name: The userland is a real Debian
        run: |
          set -e
          sudo env SKETCH_BASE="$PWD/.local-run/base" \
            ./.local-run/bin/sketchd run /bin/sh -c \
            '. /etc/os-release && echo "$PRETTY_NAME" && dpkg --version | head -1'
          sudo env SKETCH_BASE="$PWD/.local-run/base" \
            ./.local-run/bin/sketchd arch

      - name: Release layout is one per architecture
        run: |
          set -e
          # Fabricate the smallest possible dist/ (empty files, thrown away) and
          # check the publisher finds both architectures and names the assets
          # per arch. No gh, no upload: --list and --dry-run only.
          mkdir -p dist/sketch-arm64-userdebug/bin dist/sketch-amd64-userdebug/bin
          for arch in arm64 amd64; do
            d="dist/sketch-$arch-userdebug"
            : > "$d/system.img"
            : > "$d/boot.img"
            : > "$d/sketch-$arch-userdebug.zip"
            : > "$d/bin/sketchd"
            : > "$d/bin/rootfs-$arch.tar.gz"
            echo "manifest for $arch" > "$d/manifest.txt"
            echo "checksums for $arch" > "$d/SHA256SUMS"
          done
          : > dist/sketch-amd64-userdebug/sketch-amd64.iso

          bash ./scripts/publish-release.sh v0.0-test --list    | tee /tmp/list.txt
          bash ./scripts/publish-release.sh v0.0-test --dry-run | tee /tmp/dry.txt

          grep -q 'v0.0-test-arm64' /tmp/list.txt
          grep -q 'v0.0-test-amd64' /tmp/list.txt
          grep -q 'sketch-amd64.iso' /tmp/list.txt
          grep -q 'sketchd-arm64'    /tmp/list.txt
          grep -q 'sketchd-amd64'    /tmp/list.txt
          grep -q 'rootfs-arm64'     /tmp/list.txt
          echo "ok   per-arch releases resolve correctly"

      - name: An architecture with nothing in it is refused
        run: |
          set -e
          # Start from a clean dist/: an arch directory with nothing publishable
          # in it must not become a release, and with nothing else present there
          # is nothing to publish at all.
          rm -rf dist
          mkdir -p dist/sketch-riscv64-userdebug
          if bash ./scripts/publish-release.sh v0.0-test --list > /tmp/empty.txt 2>&1; then
            echo "::error::publisher accepted an empty dist/"
            exit 1
          fi
          cat /tmp/empty.txt
          grep -q 'skipping sketch-riscv64-userdebug' /tmp/empty.txt
          grep -q 'no built architectures' /tmp/empty.txt
          echo "ok   refuses to publish an empty release"
          rm -rf dist

  # ------------------------------------------------- hosted, real artifacts ---
  # Everything this project can build without an Android tree, for both
  # architectures, plus a QEMU boot of the medium it just made. The images on the
  # releases page come from here, so they are known to boot and to install a .deb.
  runtime:
    name: runtime ${{ matrix.arch }} (hosted)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h /

      - name: Tools
        run: |
          set -e
          sudo apt-get update -qq
          # These must exist: debootstrap and cpio make the userland and the
          # initramfs, the compilers build sketchd for both arches, and
          # grub/xorriso/mtools/dosfstools make the ISO and the disk image.
          sudo apt-get install -y -qq \
            debootstrap dpkg-dev cpio zip file \
            g++ g++-aarch64-linux-gnu \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools
          # The emulators and the qemu-user package names move between Ubuntu
          # releases (qemu-user-static is not on every one), so take what is
          # there and say what was not, instead of failing the whole step.
          for p in qemu-system-x86 qemu-system-arm qemu-user-static qemu-user-binfmt qemu-user binfmt-support; do
            if sudo apt-get install -y -qq "$p" >/dev/null 2>&1; then
              echo "installed      $p"
            else
              echo "not available  $p"
            fi
          done
          echo "--- emulators ---"
          ls -l /usr/bin/qemu-system-x86_64 /usr/bin/qemu-system-aarch64 /usr/bin/qemu-aarch64* 2>/dev/null || true

      - name: Cross-arch emulation is registered
        run: |
          set -e
          echo "--- binfmt entries before ---"
          ls /proc/sys/fs/binfmt_misc/ | sed 's/^/  /' || true

          # Only the arm64 leg needs this on an amd64 runner: it is how dpkg for
          # arm64 runs inside its own chroot.
          if [ "${{ matrix.arch }}" = "arm64" ] && [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            # The package-based route first, then the container one, which does
            # not depend on which package names this Ubuntu release kept.
            sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
            if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ] && command -v docker >/dev/null 2>&1; then
              echo "--- asking tonistiigi/binfmt for arm64 ---"
              docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
            fi
          fi

          echo "--- binfmt entries after ---"
          ls /proc/sys/fs/binfmt_misc/ | sed 's/^/  /' || true
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || {
              echo "::error::no arm64 binfmt handler: the arm64 userland cannot be built here"
              exit 1
            }
          fi

      - name: Build the runtime, the userland and the media
        run: |
          sudo env SKETCH_REQUIRE_MEDIA=1 SKETCH_SUITE=trixie \
            bash scripts/build-dist.sh ${{ matrix.arch }} live

      # The receipt: not "it compiled", but "it booted, installed a real package
      # and ran it". The medium ships the package it installs, and a self test
      # does exactly that when booted with sketch.selftest=1 - so these steps
      # need no typed input and cannot race the boot. Serial goes to a file
      # rather than to stdio, so nothing depends on a terminal existing.
      - name: The ISO boots (amd64)
        if: matrix.arch == 'amd64'
        run: |
          set -e
          d=dist/sketch-amd64-live
          ls -lh "$d"
          # Long enough for GRUB, the kernel and the unpacking; the medium writes
          # its banner to the serial console within seconds, so there is nothing
          # to gain from waiting longer than this.
          timeout 90 qemu-system-x86_64 -m 2048 -cdrom "$d/sketch-amd64.iso" \
            -display none -monitor none -serial file:/tmp/boot-iso.log \
            -no-reboot || true
          echo "--- what the medium said ---"
          tail -30 /tmp/boot-iso.log
          grep -a 'SketchOpenSourceProject - live medium' /tmp/boot-iso.log
          grep -a 'deb install ./foo.deb' /tmp/boot-iso.log
          echo "ok   GRUB, the kernel and the initramfs from the ISO all came up"

      - name: The shipped runtime is baseline x86-64 (amd64)
        if: matrix.arch == 'amd64'
        run: |
          set -e
          d=dist/sketch-amd64-live
          file "$d/bin/sketchd"
          if command -v readelf >/dev/null 2>&1; then
            echo "--- GNU property notes ---"
            readelf -n "$d/bin/sketchd" 2>/dev/null | sed -n '1,40p' || true
            if readelf -n "$d/bin/sketchd" 2>/dev/null |
                 grep -q 'x86 ISA needed: x86-64-v[234]'; then
              echo "::error::sketchd demands a newer x86-64 ISA; older CPUs and QEMU would refuse it"
              exit 1
            fi
          fi
          echo "ok   no x86-64-v2+ requirement in the shipped runtime"

      - name: The medium installs and runs a .deb by itself (amd64)
        if: matrix.arch == 'amd64'
        run: |
          set -e
          d=dist/sketch-amd64-live
          LOG=/tmp/selftest-amd64.log

          # QEMU's default CPU model is a 2001-era machine with none of the
          # extensions a modern distribution assumes. That is the right default
          # for this test - it is what "runs on any x86-64" means - so it is
          # tried first and its failure is real. Only if the log names the ISA
          # check specifically is it retried with a wider model, so a genuine
          # problem is never hidden behind a friendlier CPU.
          boot() {
            : > "$LOG"
            timeout 300 qemu-system-x86_64 -m 2048 -no-reboot $1 \
              -display none -monitor none -serial "file:$LOG" \
              -kernel "$d/sketch-amd64-vmlinuz" \
              -initrd "$d/sketch-amd64-initrd.gz" \
              -append "console=ttyS0,115200 panic=30 loglevel=4 sketch.selftest=1" \
              || true
          }

          boot ""
          if ! grep -qa 'SKETCH-SELFTEST-OK' "$LOG" &&
             grep -qa 'CPU ISA level is lower than required' "$LOG"; then
            echo "::warning::the runtime is not baseline x86-64 - retrying on a wider CPU model"
            boot "-cpu max"
          fi

          echo "--- what the medium said ---"
          tail -40 "$LOG"
          grep -a 'SKETCH-SELFTEST-START' "$LOG"
          grep -a 'runtime   dpkg inside a Debian chroot' "$LOG"
          grep -a 'hello from a Debian package, running on the Sketch live medium' "$LOG"
          grep -a 'SKETCH-SELFTEST-OK' "$LOG"
          echo "ok   the amd64 medium installed and ran a real .deb"

      - name: The medium installs and runs a .deb by itself (arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -e
          d=dist/sketch-arm64-live
          ls -lh "$d"
          timeout 300 qemu-system-aarch64 -M virt -cpu cortex-a57 -m 2048 -no-reboot \
            -display none -monitor none -serial file:/tmp/selftest-arm64.log \
            -kernel "$d/sketch-arm64-vmlinuz" \
            -initrd "$d/sketch-arm64-initrd.gz" \
            -append "console=ttyAMA0,115200 panic=30 loglevel=4 sketch.selftest=1" \
            || true
          echo "--- what the medium said ---"
          tail -40 /tmp/selftest-arm64.log
          grep -a 'SKETCH-SELFTEST-START' /tmp/selftest-arm64.log
          grep -a 'runtime   dpkg inside a Debian chroot' /tmp/selftest-arm64.log
          grep -a 'hello from a Debian package, running on the Sketch live medium' /tmp/selftest-arm64.log
          grep -a 'SKETCH-SELFTEST-OK' /tmp/selftest-arm64.log
          echo "ok   the arm64 medium installed and ran a real .deb"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sketch-${{ matrix.arch }}-live
          path: dist/
          retention-days: 30

  publish:
    name: publish releases (hosted)
    needs: runtime
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Work out the release tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: What would go up
        run: bash scripts/publish-release.sh "$TAG" --list

      - name: Publish one release per architecture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh "$TAG"

  # ----------------------------------------------------------- self-hosted ---
  # Sync is its own job because GitHub kills any single job at 6 hours, and
  # `repo sync` on a cold cache can take most of that on its own.
  sync:
    name: sync LineageOS
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, aosp]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Host check
        run: bash ./build.sh env
      - name: Sync LineageOS
        run: bash ./build.sh sync

  # The Android image itself: needs the LineageOS tree, ~250 GiB and hours.
  # Everything hosted CI can prove is already proven by the `runtime` job above.
  build:
    name: image ${{ matrix.arch }}
    needs: sync
    runs-on: [self-hosted, linux, aosp]
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Debian userland
        run: bash ./build.sh rootfs ${{ matrix.arch }}
      - name: Build ${{ matrix.arch }}
        env:
          VARIANT: ${{ github.event.inputs.variant || 'userdebug' }}
        run: bash ./build.sh build ${{ matrix.arch }} "$VARIANT"
      - name: Collect images, ISO and binaries
        run: bash ./scripts/make-artifacts.sh ${{ matrix.arch }} "${{ github.event.inputs.variant || 'userdebug' }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: dist/
          retention-days: 14

  image-release:
    name: publish image release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
    runs-on: [self-hosted, linux, aosp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show what will be published
        run: bash ./scripts/publish-release.sh "$TAG" --list
        env:
          TAG: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref_name) || format('sketch-{0}', github.run_number) }}
      - name: Publish one release per architecture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref_name) || format('sketch-{0}', github.run_number) }}
        run: bash ./scripts/publish-release.sh "$TAG"
