name: build

# Builds SketchOpenSourceProject on a Linux machine with the LineageOS tree and
# publishes the images, the ISO and the binaries as a release.
#
# Nothing is built on GitHub's hosted runners: even a LineageOS build needs more
# disk and hours than a hosted machine has, and the tree has to be synced once.
#
# Register a self-hosted runner on your build machine with these labels:
#   ./config.sh --labels self-hosted,linux,aosp
# and keep the LineageOS tree at $AOSP_DIR (default ~/lineage) on it.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options: [userdebug, user]
        default: userdebug
      publish:
        description: "Publish a GitHub release from the artifacts"
        type: boolean
        default: false
      tag:
        description: "Release tag (blank: sketch-<run number>)"
        type: string
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: sketch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Sync is its own job because GitHub kills any single job at 6 hours, and
  # `repo sync` on a cold cache can take most of that on its own.
  sync:
    runs-on: [self-hosted, linux, aosp]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Host check
        run: ./build.sh env
      - name: Sync LineageOS
        run: ./build.sh sync

  build:
    needs: sync
    runs-on: [self-hosted, linux, aosp]
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Debian userland
        run: ./build.sh rootfs ${{ matrix.arch }}
      - name: Build ${{ matrix.arch }}
        env:
          VARIANT: ${{ github.event.inputs.variant || 'userdebug' }}
        run: ./build.sh build ${{ matrix.arch }} "$VARIANT"
      - name: Collect images, ISO and binaries
        run: ./scripts/make-artifacts.sh ${{ matrix.arch }} "${{ github.event.inputs.variant || 'userdebug' }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sketch-${{ matrix.arch }}
          path: dist/
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: [self-hosted, linux, aosp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || format('sketch-{0}', github.run_number) }}
        run: ./scripts/publish-release.sh "$TAG"
